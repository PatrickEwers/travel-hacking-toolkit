<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Places</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#fff; --bg2:#f5f5f7; --fg:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --accent:#0a7cff; --near:#0b8a4a; --star:#f5b301; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --bg2:#2c2c2e; --fg:#f2f2f7; --muted:#a1a1a6; --line:#38383a; } }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; font:15px/1.4 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  #map { position:absolute; inset:0; }
  .top { position:absolute; top:0; left:0; right:0; z-index:1001; padding:10px 10px 0; pointer-events:none; }
  .top > * { pointer-events:auto; }
  .bar { display:flex; gap:6px; }
  .bar input { flex:1; min-width:0; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); font-size:15px; }
  button { padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); font-size:14px; cursor:pointer; white-space:nowrap; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:8px 0 4px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { display:flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px; font-size:13px; border:1px solid var(--line); background:var(--bg); }
  .chip.on { border-color:var(--fg); box-shadow:inset 0 0 0 1px var(--fg); }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .sheet { position:absolute; left:10px; right:10px; bottom:10px; z-index:1002; max-height:60%; overflow:auto;
           background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:12px 14px; box-shadow:0 4px 18px rgba(0,0,0,.18); display:none; }
  .sheet.show { display:block; }
  .sheet h2 { margin:0 0 2px; font-size:18px; display:flex; align-items:center; gap:8px; }
  .meta { color:var(--muted); font-size:13px; }
  .here { color:var(--near); font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.03em; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  .result { padding:8px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .result:last-child { border-bottom:0; }
  label { display:block; margin-top:8px; font-size:13px; color:var(--muted); }
  label input, label select, label textarea, select.inline { width:100%; margin-top:3px; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font:inherit; }
  select.inline { width:auto; margin:0; padding:6px 8px; }
  .star { background:none; border:0; padding:2px 4px; font-size:22px; line-height:1; color:var(--muted); }
  .star.is { color:var(--star); }
  .me { width:16px; height:16px; border-radius:50%; background:var(--accent); border:3px solid #fff; box-shadow:0 0 0 2px var(--accent); }
  .pin { width:30px; height:30px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); display:flex; align-items:center; justify-content:center;
         border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .pin span { transform:rotate(45deg); font-size:15px; }
  .pin.starred { border-color:var(--star); box-shadow:0 0 0 2px var(--star), 0 1px 4px rgba(0,0,0,.4); }
  .pin-wrap { position:relative; }
  .pin-wrap .s { position:absolute; top:-8px; right:-8px; font-size:13px; color:var(--star); text-shadow:0 0 2px #000; }
  /* list view */
  #list { position:absolute; inset:0; z-index:1000; background:var(--bg); overflow:auto; display:none; padding-bottom:30px; }
  #list.show { display:block; }
  .lgroup h3 { z-index:1; margin:0; padding:8px 14px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); background:var(--bg2);
               display:flex; align-items:center; gap:8px; position:sticky; top:0; }
  .litem { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .litem .ic { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; }
  .litem .body { flex:1; min-width:0; }
  .litem .name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .litem .meta { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ltools { display:flex; gap:6px; padding:8px 14px; align-items:center; }
  .empty { padding:30px 14px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<div id="map"></div>
<div id="list"></div>
<div class="top">
  <div class="bar">
    <input id="q" placeholder="Add a place by name, or paste a Google Maps link" autocomplete="off">
    <button class="primary" id="go">Add</button>
    <button id="locate" title="Track my location">◎</button>
    <button id="view" title="Switch between map and list">List</button>
  </div>
  <div class="chips" id="chips"></div>
</div>
<div class="sheet" id="sheet"></div>

<script>
const SEED = /*__PLACES__*/null;
const NEAR_METERS = 120;
const LS = { places:'myplaces.local.v1', over:'myplaces.overrides.v1', cats:'myplaces.cats.v1' };
const PALETTE = ['#0ca678','#e64980','#4c6ef5','#fab005','#ae3ec9','#15aabf','#fd7e14','#82c91e','#f03e3e','#3bc9db'];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => s.toLowerCase().normalize('NFKD').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-').slice(0,60);
const load = k => JSON.parse(localStorage.getItem(k) || (k === LS.over ? '{}' : '[]'));
const store = (k, v) => localStorage.setItem(k, JSON.stringify(v));

// ---------- data: seed (from data/places.json) + this device's additions and edits ----------
function allCats() {
  const seed = (SEED && SEED.categories) || [];
  const ids = new Set(seed.map(c => c.id));
  const custom = load(LS.cats).filter(c => !ids.has(c.id));
  const cats = seed.filter(c => c.id !== 'other').concat(custom);
  const other = seed.find(c => c.id === 'other') || { id:'other', label:'Other', color:'#868e96', icon:'📍', keywords:[] };
  return cats.concat(other); // "Other" always last
}
const cat = id => allCats().find(c => c.id === id) || allCats().find(c => c.id === 'other');
function allPlaces() {
  const seed = (SEED && SEED.places) || [];
  const ids = new Set(seed.map(p => p.id));
  const over = load(LS.over);
  return seed.concat(load(LS.places).filter(p => !ids.has(p.id)))
    .map(p => ({ ...p, ...(over[p.id] || {}) }))
    .map(p => ({ ...p, category: allCats().some(c => c.id === p.category) ? p.category : 'other' }));
}
const isLocal = id => load(LS.places).some(p => p.id === id);
function setField(id, field, value) {
  if (isLocal(id)) {
    store(LS.places, load(LS.places).map(p => p.id === id ? { ...p, [field]: value } : p));
  } else {
    const over = load(LS.over); over[id] = { ...(over[id] || {}), [field]: value }; store(LS.over, over);
  }
}
function addCategory(label) {
  label = label.trim(); if (!label) return null;
  const existing = allCats().find(c => c.label.toLowerCase() === label.toLowerCase() || c.id === slug(label));
  if (existing) return existing.id;
  const custom = load(LS.cats);
  const c = { id: slug(label), label, color: PALETTE[custom.length % PALETTE.length], icon: '📍', keywords: [label.toLowerCase()], custom: true };
  store(LS.cats, custom.concat(c));
  return c.id;
}

// ---------- auto-categorization ----------
const OSM_MAP = {
  nightclub:'nightclub', stripclub:'nightclub', bar:'bar', pub:'bar', biergarten:'bar',
  restaurant:'restaurant', fast_food:'restaurant', food_court:'street-food',
  cafe:'cafe', bakery:'cafe', ice_cream:'cafe', coffee:'cafe', tea:'cafe', confectionery:'cafe',
  marketplace:'market', mall:'mall', department_store:'mall', supermarket:'mall', clothes:'mall', boutique:'mall',
  place_of_worship:'temple', museum:'museum', gallery:'museum', arts_centre:'museum',
  park:'park', garden:'park', beach:'park', viewpoint:'park', nature_reserve:'park',
  massage:'spa', spa:'spa', sauna:'spa', beauty:'spa',
  hotel:'hotel', hostel:'hotel', guest_house:'hotel', motel:'hotel', apartment:'hotel'
};
function classify({ name = '', osmType = '', osmClass = '', text = '' }) {
  const hay = ` ${(name + ' ' + text).toLowerCase()} `;
  // 1) keyword match on the name/description: longest keyword wins ("rooftop bar" beats "bar")
  let best = null, bestLen = 0;
  for (const c of allCats()) for (const k of (c.keywords || []).concat(c.custom ? [c.label.toLowerCase()] : [])) {
    const re = new RegExp(`(^|[^a-z])${k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}([^a-z]|$)`);
    if (k.length > bestLen && re.test(hay)) { best = c.id; bestLen = k.length; }
  }
  if (best) return best;
  // 2) fall back to what OpenStreetMap says the place is
  if (OSM_MAP[osmType]) return OSM_MAP[osmType];
  if (osmClass === 'shop') return 'mall';
  if (osmClass === 'tourism' && osmType === 'attraction') return 'other';
  return 'other';
}

// ---------- helpers ----------
const gq = p => p.gmaps_query || [p.name, p.address || p.city].filter(Boolean).join(', ');
const gmaps = p => p.google_maps_url || 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(gq(p));
const gdirections = p => 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(gq(p));
function dist(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = m => m < 1000 ? Math.round(m) + ' m' : (m/1000).toFixed(1) + ' km';
function catOptions(selected) {
  return allCats().map(c => `<option value="${esc(c.id)}" ${c.id === selected ? 'selected' : ''}>${c.icon} ${esc(c.label)}</option>`).join('')
    + '<option value="__new">＋ New category…</option>';
}
function pickCategory(sel, onPick) {
  sel.onchange = () => {
    if (sel.value !== '__new') return onPick(sel.value);
    const label = prompt('Name of the new category (e.g. "Jazz bar", "Live music")');
    const id = label && addCategory(label);
    if (id) onPick(id); else sel.value = sel.dataset.prev || 'other';
  };
}

// ---------- state ----------
const filter = { cats: new Set(), starred: false };
let view = 'map', me = null, meMarker = null, nearShownId = null;
const visible = () => allPlaces().filter(p => (!filter.starred || p.starred) && (!filter.cats.size || filter.cats.has(p.category)));

// ---------- map ----------
const map = L.map('map', { zoomControl:false }).setView([13.7466, 100.5393], 13); // Bangkok
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' }).addTo(map);
const layer = L.layerGroup().addTo(map);
const pinIcon = p => { const c = cat(p.category); return L.divIcon({ className:'', iconSize:[30,30], iconAnchor:[15,30],
  html:`<div class="pin-wrap"><div class="pin ${p.starred ? 'starred' : ''}" style="background:${c.color}"><span>${c.icon}</span></div>${p.starred ? '<span class="s">★</span>' : ''}</div>` }); };
let fitted = false;
function renderMap() {
  layer.clearLayers();
  const ps = visible();
  ps.forEach(p => L.marker([p.lat, p.lng], { icon:pinIcon(p), title:p.name, zIndexOffset:p.starred ? 500 : 0 }).addTo(layer).on('click', () => showPlace(p.id)));
  if (ps.length && !me && !fitted) { map.fitBounds(L.latLngBounds(ps.map(p => [p.lat, p.lng])).pad(0.3), { maxZoom:15 }); fitted = true; }
}

// ---------- chips (filter + legend) ----------
function renderChips() {
  const ps = allPlaces();
  const counts = {}; ps.forEach(p => counts[p.category] = (counts[p.category] || 0) + 1);
  const nStar = ps.filter(p => p.starred).length;
  const cats = allCats().filter(c => counts[c.id]);
  document.getElementById('chips').innerHTML =
    `<button class="chip ${!filter.cats.size && !filter.starred ? 'on' : ''}" data-k="all">All ${ps.length}</button>` +
    `<button class="chip ${filter.starred ? 'on' : ''}" data-k="star">★ Starred ${nStar}</button>` +
    cats.map(c => `<button class="chip ${filter.cats.has(c.id) ? 'on' : ''}" data-k="${esc(c.id)}"><span class="dot" style="background:${c.color}"></span>${c.icon} ${esc(c.label)} ${counts[c.id]}</button>`).join('');
  document.querySelectorAll('#chips .chip').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (k === 'all') { filter.cats.clear(); filter.starred = false; }
    else if (k === 'star') filter.starred = !filter.starred;
    else filter.cats.has(k) ? filter.cats.delete(k) : filter.cats.add(k);
    renderAll();
  });
}

// ---------- list view ----------
let sortBy = 'category';
function renderList() {
  const el = document.getElementById('list');
  const ps = visible().map(p => ({ ...p, d: me ? dist(me, p) : null }));
  const byName = (a, b) => (b.starred - a.starred) || a.name.localeCompare(b.name);
  const byDist = (a, b) => (a.d ?? 0) - (b.d ?? 0) || byName(a, b);
  const item = p => { const c = cat(p.category); return `<div class="litem" data-id="${esc(p.id)}">
      <div class="ic" style="background:${c.color}">${c.icon}</div>
      <div class="body"><div class="name">${esc(p.name)}</div>
        <div class="meta">${esc(c.label)}${p.city ? ' · ' + esc(p.city) : ''}${p.d != null ? ' · ' + fmtDist(p.d) : ''}${p.address ? ' · ' + esc(p.address) : ''}</div></div>
      <button class="star ${p.starred ? 'is' : ''}" data-star="${esc(p.id)}" title="Star">${p.starred ? '★' : '☆'}</button></div>`; };
  let body;
  if (!ps.length) body = `<div class="empty">No places match this filter.</div>`;
  else if (sortBy === 'category') {
    body = allCats().map(c => { const g = ps.filter(p => p.category === c.id).sort(byName); return g.length ?
      `<div class="lgroup"><h3><span class="dot" style="background:${c.color}"></span>${c.icon} ${esc(c.label)} · ${g.length}</h3>${g.map(item).join('')}</div>` : ''; }).join('');
  } else body = ps.sort(sortBy === 'distance' ? byDist : byName).map(item).join('');
  const topH = document.querySelector('.top').offsetHeight;
  el.innerHTML = `<div style="height:${topH}px"></div>
    <div class="ltools"><span class="meta">Sort</span>
      <select class="inline" id="sort">${[['category','By category'],['distance','By distance'],['name','By name']].map(([v,l]) => `<option value="${v}" ${v===sortBy?'selected':''}>${l}</option>`).join('')}</select>
      <span style="flex:1"></span><button id="import">Import…</button><button id="export">Export…</button></div>${body}`;
  el.querySelectorAll('.lgroup h3').forEach(h => h.style.top = topH + 'px');
  el.querySelectorAll('.litem').forEach(r => r.onclick = e => { if (e.target.dataset.star) return; showPlace(r.dataset.id); });
  el.querySelectorAll('[data-star]').forEach(b => b.onclick = () => toggleStar(b.dataset.star));
  document.getElementById('sort').onchange = e => { sortBy = e.target.value; renderList(); };
  document.getElementById('export').onclick = showExport;
  document.getElementById('import').onclick = showImport;
}

function renderAll() { renderChips(); renderMap(); if (view === 'list') renderList(); }
function setView(v) {
  view = v;
  document.getElementById('list').classList.toggle('show', v === 'list');
  document.getElementById('view').textContent = v === 'list' ? 'Map' : 'List';
  close(); renderAll();
}
document.getElementById('view').onclick = () => setView(view === 'list' ? 'map' : 'list');

// ---------- place card ----------
const sheet = document.getElementById('sheet');
const open = html => { sheet.innerHTML = html; sheet.classList.add('show'); };
const close = () => sheet.classList.remove('show');
map.on('click', close);
let shownId = null, shownHere = false;
function toggleStar(id) {
  const p = allPlaces().find(x => x.id === id); setField(id, 'starred', !p.starred);
  renderAll(); if (shownId === id && sheet.classList.contains('show')) showPlace(id, shownHere, true);
}
window.toggleStar = toggleStar;
function showPlace(id, isHere, keepView) {
  const p = allPlaces().find(x => x.id === id); if (!p) return;
  shownId = id; shownHere = !!isHere;
  if (view === 'list' && !keepView) setView('map');
  const c = cat(p.category), d = me ? fmtDist(dist(me, p)) + ' away' : '';
  open(`
    ${isHere ? '<div class="here">📍 You are here</div>' : ''}
    <h2><span class="dot" style="background:${c.color};width:12px;height:12px"></span>${esc(p.name)}
      <button class="star ${p.starred ? 'is' : ''}" onclick="toggleStar('${esc(p.id)}')" title="Star">${p.starred ? '★' : '☆'}</button></h2>
    <div class="row" style="margin-top:4px"><select class="inline" id="p-cat" data-prev="${esc(p.category)}">${catOptions(p.category)}</select>
      <span class="meta">${p.city ? esc(p.city) : ''}${d ? ' · ' + d : ''}</span></div>
    ${p.address ? `<div class="meta" style="margin-top:6px">${esc(p.address)}</div>` : ''}
    ${p.notes ? `<p>${esc(p.notes)}</p>` : ''}
    ${p.hours ? `<div class="meta">🕒 ${esc(p.hours)}</div>` : ''}
    ${(p.sources||[]).length ? `<div class="meta">${p.sources.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(new URL(u).hostname)}</a>`).join(' · ')}</div>` : ''}
    <div class="row">
      <a href="${gmaps(p)}" target="_blank" rel="noopener"><button class="primary">Open in Google Maps</button></a>
      <a href="${gdirections(p)}" target="_blank" rel="noopener"><button>Directions</button></a>
      <button onclick="sharePlace('${esc(p.id)}')">Share</button>
      ${isLocal(p.id) ? `<button onclick="removePlace('${esc(p.id)}')">Delete</button>` : ''}
    </div>`);
  pickCategory(document.getElementById('p-cat'), cid => { setField(p.id, 'category', cid); renderAll(); showPlace(p.id, isHere, true); });
  if (view === 'map') map.panTo([p.lat, p.lng]);
}
window.sharePlace = async id => {
  const p = allPlaces().find(x => x.id === id);
  const url = gmaps(p), text = `${p.name}${p.notes ? ' — ' + p.notes.split('. ')[0] : ''}`;
  if (navigator.share) { try { await navigator.share({ title:p.name, text, url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  await navigator.clipboard.writeText(`${p.name}\n${url}`);
  alert('Google Maps link copied');
};
window.removePlace = id => { store(LS.places, load(LS.places).filter(p => p.id !== id)); close(); renderAll(); };

// ---------- location awareness ----------
function onPos(pos) {
  me = { lat:pos.coords.latitude, lng:pos.coords.longitude };
  if (!meMarker) {
    meMarker = L.marker([me.lat, me.lng], { icon:L.divIcon({ className:'', html:'<div class="me"></div>', iconSize:[22,22] }), zIndexOffset:1000 }).addTo(map);
    map.setView([me.lat, me.lng], 16);
  } else meMarker.setLatLng([me.lat, me.lng]);
  const nearest = allPlaces().map(p => ({ p, d:dist(me, p) })).sort((a,b) => a.d - b.d)[0];
  if (nearest && nearest.d <= NEAR_METERS) {
    if (nearShownId !== nearest.p.id) { nearShownId = nearest.p.id; showPlace(nearest.p.id, true); if (navigator.vibrate) navigator.vibrate(80); }
  } else nearShownId = null;
  if (view === 'list') renderList();
}
function startTracking() {
  if (!navigator.geolocation) return alert('Geolocation not available in this browser');
  navigator.geolocation.watchPosition(onPos, e => alert('Location: ' + e.message), { enableHighAccuracy:true, maximumAge:15000 });
}
document.getElementById('locate').onclick = startTracking;
if (navigator.permissions) navigator.permissions.query({ name:'geolocation' }).then(s => { if (s.state === 'granted') startTracking(); });

// ---------- add by name ----------
function parseGmapsUrl(s) {
  const m = s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || s.match(/[?&](?:q|query|ll)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/) || s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  if (!m) return null;
  const name = decodeURIComponent((s.match(/\/place\/([^/@]+)/) || [,''])[1]).replace(/\+/g, ' ');
  return { lat:+m[1], lng:+m[2], name };
}
async function search(q) {
  const c = map.getCenter();
  const vb = [c.lng - 0.3, c.lat + 0.3, c.lng + 0.3, c.lat - 0.3].join(',');
  const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&extratags=1&limit=6&viewbox=${vb}&q=${encodeURIComponent(q)}`;
  const r = await fetch(url, { headers:{ 'Accept-Language':'en' } });
  return r.ok ? r.json() : [];
}
function addForm(seed) {
  const auto = seed.category || classify({ name: seed.name, osmType: seed.osmType, osmClass: seed.osmClass, text: seed.text });
  if (view === 'list') setView('map');
  open(`<h2>New place</h2>
    <label>Name<input id="f-name" value="${esc(seed.name)}"></label>
    <label>Category <span id="f-auto">(auto: ${esc(cat(auto).label)})</span><select id="f-cat" data-prev="${esc(auto)}">${catOptions(auto)}</select></label>
    <label>Address / floor<input id="f-addr" value="${esc(seed.address || '')}"></label>
    <label>Notes<textarea id="f-notes" rows="3" placeholder="What makes it good, what to order"></textarea></label>
    <div class="row"><button class="star" id="f-star" title="Star">☆</button><span class="meta">Pin: ${seed.lat.toFixed(5)}, ${seed.lng.toFixed(5)} — drag the marker to adjust</span></div>
    <div class="row"><button class="primary" id="f-save">Save</button><button onclick="cancelAdd()">Cancel</button></div>`);
  const tmp = L.marker([seed.lat, seed.lng], { draggable:true }).addTo(map);
  map.setView([seed.lat, seed.lng], 17);
  const sel = document.getElementById('f-cat');
  let touched = false;
  pickCategory(sel, cid => { touched = true; sel.innerHTML = catOptions(cid); sel.dataset.prev = cid; document.getElementById('f-auto').textContent = ''; });
  // re-run auto-categorization as the user edits the name/notes, until they pick one by hand
  const recat = () => { if (touched) return; const c = classify({ name: document.getElementById('f-name').value, osmType: seed.osmType, osmClass: seed.osmClass,
      text: document.getElementById('f-notes').value + ' ' + (seed.text || '') });
    sel.value = c; sel.dataset.prev = c; document.getElementById('f-auto').textContent = `(auto: ${cat(c).label})`; };
  document.getElementById('f-name').oninput = recat; document.getElementById('f-notes').oninput = recat;
  let starred = false;
  const sb = document.getElementById('f-star');
  sb.onclick = () => { starred = !starred; sb.textContent = starred ? '★' : '☆'; sb.classList.toggle('is', starred); };
  window.cancelAdd = () => { map.removeLayer(tmp); close(); };
  document.getElementById('f-save').onclick = () => {
    const ll = tmp.getLatLng(), name = document.getElementById('f-name').value.trim();
    if (!name) return;
    const today = new Date().toISOString().slice(0,10);
    const p = { id: slug(name) + '-' + Date.now().toString(36).slice(-4), name, category: sel.value === '__new' ? 'other' : sel.value,
      city: seed.city || '', country: seed.country || '', address: document.getElementById('f-addr').value.trim(),
      lat:+ll.lat.toFixed(6), lng:+ll.lng.toFixed(6), coords_precision:'exact', notes: document.getElementById('f-notes').value.trim(),
      tags:[], sources:[], starred, visited: today, added: today };
    store(LS.places, load(LS.places).concat(p)); map.removeLayer(tmp); document.getElementById('q').value = ''; renderAll(); showPlace(p.id);
  };
}
document.getElementById('go').onclick = async () => {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const g = parseGmapsUrl(q);
  if (g) return addForm({ ...g, name: g.name || '' });
  if (view === 'list') setView('map');
  open('<div class="meta">Searching…</div>');
  let res = [];
  try { res = await search(q); } catch (e) {}
  const items = res.map((r, i) => `<div class="result" data-i="${i}"><b>${cat(classify({ name:r.name || '', osmType:r.type, osmClass:r.category })).icon} ${esc(r.name || r.display_name.split(',')[0])}</b><div class="meta">${esc(r.display_name)}</div></div>`).join('');
  open(`<h2>Pick a match for “${esc(q)}”</h2>${items || '<div class="meta">No match on OpenStreetMap.</div>'}
    <div class="row">${me ? '<button id="use-here">Use my current location</button>' : ''}<button id="use-center">Place at map center</button></div>`);
  sheet.querySelectorAll('.result').forEach(el => el.onclick = () => {
    const r = res[+el.dataset.i], a = r.address || {};
    addForm({ name: r.name || q, lat:+r.lat, lng:+r.lon, address: r.display_name.split(',').slice(0,4).join(','),
      city: a.city || a.town || a.state || '', country: a.country || '', osmType: r.type, osmClass: r.category,
      text: Object.values(r.extratags || {}).join(' ') });
  });
  const uh = document.getElementById('use-here'); if (uh) uh.onclick = () => addForm({ name:q, ...me });
  document.getElementById('use-center').onclick = () => { const c = map.getCenter(); addForm({ name:q, lat:c.lat, lng:c.lng }); };
};
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('go').click(); });

// ---------- export ----------
function download(name, mime, body) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], { type:mime })); a.download = name; a.click();
}
const kmlColor = hex => 'ff' + hex.slice(5,7) + hex.slice(3,5) + hex.slice(1,3); // KML is aabbggrr
function toKML(ps) {
  const used = allCats().filter(c => ps.some(p => p.category === c.id));
  return `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>My Places</name>\n` +
    used.map(c => `<Style id="cat-${esc(c.id)}"><IconStyle><color>${kmlColor(c.color)}</color></IconStyle></Style>`).join('\n') + '\n' +
    used.map(c => `<Folder><name>${esc(c.label)}</name>\n` + ps.filter(p => p.category === c.id).map(p =>
      `<Placemark><name>${esc((p.starred ? '★ ' : '') + p.name)}</name><styleUrl>#cat-${esc(c.id)}</styleUrl><description>${esc([c.label, p.address, p.notes, gmaps(p)].filter(Boolean).join('\n'))}</description><Point><coordinates>${p.lng},${p.lat},0</coordinates></Point></Placemark>`).join('\n') + `\n</Folder>`).join('\n') +
    `\n</Document></kml>`;
}
function toCSV(ps) {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  return ['name,category,starred,address,city,latitude,longitude,notes,google_maps_url']
    .concat(ps.map(p => [p.name, cat(p.category).label, p.starred ? 'yes' : '', p.address, p.city, p.lat, p.lng, p.notes, gmaps(p)].map(q).join(','))).join('\n');
}
function showExport() {
  if (view === 'list') setView('map');
  const nChanges = load(LS.places).length + Object.keys(load(LS.over)).length + load(LS.cats).length;
  open(`<h2>Export</h2>
    <div class="row">
      <button id="x-kml">KML for Google My Maps</button>
      <button id="x-csv">CSV</button>
      <button id="x-json" class="primary">My changes (JSON) · ${nChanges}</button>
    </div>
    <div class="meta" style="margin-top:8px">New places, stars, category changes and new categories are saved on this device only.
      Export “My changes” and give the file to Claude to make them permanent for every device.</div>`);
  document.getElementById('x-kml').onclick = () => download('my-places.kml', 'application/vnd.google-earth.kml+xml', toKML(allPlaces()));
  document.getElementById('x-csv').onclick = () => download('my-places.csv', 'text/csv', toCSV(allPlaces()));
  document.getElementById('x-json').onclick = () => download('my-places-changes.json', 'application/json',
    JSON.stringify({ exported: new Date().toISOString(), new_places: load(LS.places), edits: load(LS.over), new_categories: load(LS.cats) }, null, 2));
}

// ---------- import from Google Takeout ----------
// Accepts the Takeout .zip, or individual files from it:
//   Maps (your places)/Saved Places.json   GeoJSON, starred places, usually with coordinates
//   Maps (your places)/Reviews.json        GeoJSON, places you reviewed
//   Maps/My labeled places/Labeled places.json
//   Saved/<list name>.csv                  one CSV per saved list; often only Title/Note/URL, no coordinates
const FAV_LISTS = /^(favou?rite|starred|star)/i;
function coordsFromUrl(u) {
  if (!u) return null;
  const m = u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || u.match(/[?&](?:q|query|ll)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/);
  return m ? { lat:+m[1], lng:+m[2] } : null;
}
function nameFromUrl(u) {
  const m = (u || '').match(/\/place\/([^/@?]+)/);
  return m ? decodeURIComponent(m[1]).replace(/\+/g, ' ') : '';
}
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function fromGeoJSON(json, source) {
  return (json.features || []).map(ft => {
    const pr = ft.properties || {}, loc = pr.location || pr.Location || {};
    const g = (ft.geometry && ft.geometry.coordinates) || [];
    let lat = +g[1], lng = +g[0];
    const geo = loc['Geo Coordinates'];
    if ((!lat && !lng) && geo) { lat = +geo.Latitude; lng = +geo.Longitude; }
    const url = pr.google_maps_url || pr['Google Maps URL'] || '';
    if (!lat && !lng) { const c = coordsFromUrl(url); if (c) ({ lat, lng } = c); }
    return {
      name: loc.name || loc['Business Name'] || pr.Title || pr.name || nameFromUrl(url),
      address: loc.address || loc.Address || pr.address || '',
      country: loc.country_code || loc['Country Code'] || '',
      lat: lat || null, lng: lng || null, url,
      note: pr.Comment || pr.review_text_published || pr['Review Comment'] || '',
      list: source, starred: /saved places/i.test(source),
      date: (pr.date || pr.Published || pr.Updated || '').slice(0, 10)
    };
  }).filter(x => x.name);
}
function fromSavedCSV(text, listName) {
  const rows = parseCSV(text); if (!rows.length) return [];
  const head = rows[0].map(h => h.trim().toLowerCase());
  const col = n => head.indexOf(n);
  const ui = col('url');
  return rows.slice(1).map(r => {
    // unquoted URLs like .../@13.74,100.48,17z contain commas: glue the extra fields back into the URL
    if (ui >= 0 && r.length > head.length) r = r.slice(0, ui).concat(r.slice(ui, ui + r.length - head.length + 1).join(','), r.slice(ui + r.length - head.length + 1));
    const url = r[ui] || '';
    const c = coordsFromUrl(url);
    return { name: (r[col('title')] || '').trim() || nameFromUrl(url), note: [r[col('note')], r[col('comment')]].filter(Boolean).join(' — '),
      tags: (r[col('tags')] || '').split(/[,;]/).map(s => s.trim()).filter(Boolean),
      url, lat: c ? c.lat : null, lng: c ? c.lng : null, address: '', list: listName, starred: FAV_LISTS.test(listName) };
  }).filter(x => x.name);
}
async function readImportFiles(files) {
  const out = [];
  const handle = async (path, text) => {
    const base = path.split('/').pop(), listName = base.replace(/\.(csv|json)$/i, '');
    if (/\.json$/i.test(base)) { try { const j = JSON.parse(text); if (j.features) out.push(...fromGeoJSON(j, listName)); } catch (e) {} }
    else if (/\.csv$/i.test(base)) out.push(...fromSavedCSV(text, listName));
  };
  for (const f of files) {
    if (/\.zip$/i.test(f.name)) {
      if (!window.JSZip) await new Promise((ok, err) => { const s = document.createElement('script');
        s.src = 'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js'; s.onload = ok; s.onerror = err; document.head.appendChild(s); });
      const zip = await JSZip.loadAsync(f);
      for (const path of Object.keys(zip.files)) {
        if (!/(maps|saved)/i.test(path) || !/\.(csv|json)$/i.test(path)) continue;
        await handle(path, await zip.files[path].async('string'));
      }
    } else await handle(f.name, await f.text());
  }
  return out;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function geocodeName(name, hint) {
  const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=1&q=${encodeURIComponent([name, hint].filter(Boolean).join(', '))}`;
  const r = await fetch(url, { headers:{ 'Accept-Language':'en' } }); if (!r.ok) return null;
  const [hit] = await r.json(); if (!hit) return null;
  const a = hit.address || {};
  return { lat:+hit.lat, lng:+hit.lon, address: hit.display_name.split(',').slice(0,4).join(','), city: a.city || a.town || a.state || '',
    country: a.country || '', osmType: hit.type, osmClass: hit.category };
}
function showImport() {
  if (view === 'list') setView('map');
  open(`<h2>Import from Google Maps</h2>
    <ol class="meta" style="padding-left:18px;margin:6px 0">
      <li>Go to <a href="https://takeout.google.com" target="_blank" rel="noopener">takeout.google.com</a> → “Deselect all”.</li>
      <li>Tick <b>Saved</b> (your lists) and <b>Maps (your places)</b> (starred places, reviews). Optionally <b>Maps</b> (labeled places).</li>
      <li>Export once, download the .zip, and pick it here. Individual .csv/.json files work too.</li>
    </ol>
    <label>Hint for places without coordinates (helps the lookup)<input id="i-hint" placeholder="e.g. Bangkok"></label>
    <div class="row"><input type="file" id="i-file" accept=".zip,.json,.csv" multiple></div>
    <div id="i-status" class="meta" style="margin-top:8px"></div>`);
  document.getElementById('i-file').onchange = async e => {
    const st = document.getElementById('i-status'), hint = document.getElementById('i-hint').value.trim();
    st.textContent = 'Reading…';
    let items;
    try { items = await readImportFiles([...e.target.files]); } catch (err) { st.textContent = 'Could not read that file: ' + err.message; return; }
    if (!items.length) { st.textContent = 'No saved places found. Make sure the export includes “Saved” or “Maps (your places)”.'; return; }
    // de-duplicate: same Google URL, or same name within 150 m; merge lists/stars
    const existing = allPlaces(), merged = [];
    for (const it of items) {
      const twin = merged.find(m => (it.url && m.url === it.url) || (m.name.toLowerCase() === it.name.toLowerCase() && (!m.lat || !it.lat || dist(m, it) < 150)));
      if (twin) { twin.lists.add(it.list); twin.starred ||= it.starred; twin.note ||= it.note; if (!twin.lat && it.lat) Object.assign(twin, { lat:it.lat, lng:it.lng }); twin.tags.push(...(it.tags||[])); }
      else merged.push({ ...it, lists: new Set([it.list]), tags: [...(it.tags || [])] });
    }
    const fresh = merged.filter(m => !existing.some(p => (m.url && p.google_maps_url === m.url) || (p.name.toLowerCase() === m.name.toLowerCase() && (!m.lat || dist(p, m) < 150))));
    const skipped = merged.length - fresh.length, failed = [], added = [];
    const today = new Date().toISOString().slice(0,10);
    for (let i = 0; i < fresh.length; i++) {
      const m = fresh[i];
      st.textContent = `Importing ${i + 1} / ${fresh.length}: ${m.name}${!m.lat ? ' (looking up location…)' : ''}`;
      let geo = null;
      if (!m.lat) { try { geo = await geocodeName(m.name, m.address || hint); } catch (err) {} await sleep(1100); } // Nominatim: max 1 req/s
      if (!m.lat && !geo) { failed.push(m); continue; }
      const listTags = [...m.lists].map(s => s.toLowerCase());
      const p = { id: slug(m.name) + '-' + Math.random().toString(36).slice(2, 6), name: m.name,
        category: classify({ name: m.name, osmType: geo && geo.osmType, osmClass: geo && geo.osmClass, text: [m.note, ...listTags, ...m.tags].join(' ') }),
        city: (geo && geo.city) || '', country: (geo && geo.country) || m.country || '', address: m.address || (geo && geo.address) || '',
        lat: +(m.lat || geo.lat).toFixed(6), lng: +(m.lng || geo.lng).toFixed(6), coords_precision: m.lat ? 'exact' : 'approximate',
        google_maps_url: m.url || undefined, notes: m.note || '', tags: [...new Set(listTags.concat(m.tags))], sources: [],
        starred: !!m.starred, visited: null, added: today, imported_from: 'google-takeout' };
      added.push(p);
    }
    store(LS.places, load(LS.places).concat(added)); fitted = false; renderAll();
    st.innerHTML = `<b>Imported ${added.length}</b>${skipped ? ` · ${skipped} already here` : ''}${failed.length ? ` · ${failed.length} couldn't be located` : ''}.
      Categories were set automatically; fix any from the place card or the list.
      ${added.some(p => p.coords_precision === 'approximate') ? '<br>Pins looked up by name are approximate: check them.' : ''}
      ${failed.length ? `<br><button id="i-failed">Download the ${failed.length} unlocated places</button>` : ''}
      <br>Then use Export… → My changes and send the file to Claude to save it for all devices.`;
    const fb = document.getElementById('i-failed');
    if (fb) fb.onclick = () => download('unlocated-places.csv', 'text/csv', 'name,lists,note,url\n' +
      failed.map(m => [m.name, [...m.lists].join('; '), m.note, m.url].map(v => `"${String(v || '').replace(/"/g,'""')}"`).join(',')).join('\n'));
  };
}

// deep links: #<place-id> opens a place, #list opens the list
renderAll();
const hash = decodeURIComponent(location.hash.slice(1));
if (hash === 'list') setView('list');
else if (hash === 'import') showImport();
else if (hash) showPlace(hash);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Walkabout</title>
<meta name="description" content="Walkabout: your places on a map, with a heads-up when you're standing at one.">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<style>
  :root { --bg:#fff; --bg2:#f5f5f7; --fg:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --accent:#0a7cff; --near:#0b8a4a; --star:#f5b301; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --bg2:#2c2c2e; --fg:#f2f2f7; --muted:#a1a1a6; --line:#38383a; } }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; font:15px/1.4 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  #map { position:absolute; inset:0; }
  .top { position:absolute; top:0; left:0; right:0; z-index:1001; padding:10px 10px 0; pointer-events:none; }
  .top > * { pointer-events:auto; }
  .bar { display:flex; gap:6px; }
  .bar input { flex:1; min-width:0; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); font-size:15px; }
  button { padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); font-size:14px; cursor:pointer; white-space:nowrap; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:8px 0 4px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { display:flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px; font-size:13px; border:1px solid var(--line); background:var(--bg); }
  .chip.on { border-color:var(--fg); box-shadow:inset 0 0 0 1px var(--fg); }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .sheet { position:absolute; left:10px; right:10px; bottom:10px; z-index:1002; max-height:60%; overflow:auto;
           background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:12px 14px; box-shadow:0 4px 18px rgba(0,0,0,.18); display:none; }
  .sheet.show { display:block; }
  .sheet h2 { margin:0 0 2px; font-size:18px; display:flex; align-items:center; gap:8px; }
  .meta { color:var(--muted); font-size:13px; }
  .here { color:var(--near); font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.03em; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  .result { padding:8px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .result:last-child { border-bottom:0; }
  label { display:block; margin-top:8px; font-size:13px; color:var(--muted); }
  label input, label select, label textarea, select.inline { width:100%; margin-top:3px; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font:inherit; }
  select.inline { width:auto; margin:0; padding:6px 8px; }
  .star { background:none; border:0; padding:2px 4px; font-size:22px; line-height:1; color:var(--muted); }
  .star.is { color:var(--star); }
  .me { width:16px; height:16px; border-radius:50%; background:var(--accent); border:3px solid #fff; box-shadow:0 0 0 2px var(--accent); }
  .pin { width:30px; height:30px; border-radius:50% 50% 50% 4px; transform:rotate(-45deg); display:flex; align-items:center; justify-content:center;
         border:1.5px solid rgba(255,255,255,.95); box-shadow:0 2px 5px rgba(9,40,42,.35); }
  .pin svg { transform:rotate(45deg); width:16px; height:16px; }
  .pin.starred { box-shadow:0 0 0 2px var(--star), 0 2px 5px rgba(9,40,42,.35); }
  .pin-wrap { position:relative; }
  .gl { display:inline-flex; vertical-align:-3px; }
  .chip .gl svg { width:15px; height:15px; }
  .lgroup h3 .gl svg { width:15px; height:15px; }
  select.chip.citysel, select.chip.statsel { appearance:none; -webkit-appearance:none; font:inherit; font-size:14px; font-weight:600; color:var(--fg); max-width:170px; text-overflow:ellipsis; }
  select.chip.citysel.on, select.chip.statsel.on { background:var(--brand); color:#fff; }
  .citybtn { min-height:0 !important; padding:6px 10px !important; font-size:14px !important; border-radius:8px; color:var(--muted); }
  .closed { display:inline-block; padding:2px 8px; border-radius:6px; background:#f3d9d6; color:#8a2c22; font-size:12px; font-weight:600; }
  .pin.gone { opacity:.55; filter:grayscale(1); }
  /* list view */
  #list { position:absolute; inset:0; z-index:1000; background:var(--bg); overflow:auto; display:none; padding-bottom:30px; }
  #list.show { display:block; }
  .lgroup h3 { z-index:1; margin:0; padding:8px 14px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); background:var(--bg2);
               display:flex; align-items:center; gap:8px; position:sticky; top:0; }
  .litem { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .litem .ic { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; }
  .litem .body { flex:1; min-width:0; }
  .litem .name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .litem .meta { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ltools { display:flex; gap:6px; padding:8px 14px; align-items:center; }
  #recent { position:absolute; inset:0; z-index:1004; background:var(--bg); overflow:auto; display:none; padding:calc(var(--safe-t) + 8px) 0 30px; bottom:calc(var(--nav-h) + var(--safe-b)); -webkit-overflow-scrolling:touch; }
  #recent.show { display:block; }
  #trips { position:absolute; inset:0; z-index:1004; background:var(--bg); overflow:auto; display:none; padding:calc(var(--safe-t) + 8px) 0 30px; bottom:calc(var(--nav-h) + var(--safe-b)); -webkit-overflow-scrolling:touch; }
  #trips.show { display:block; }
  .tcard { margin:0 16px 10px; padding:14px; border:1px solid var(--line); border-radius:14px; cursor:pointer; }
  .tcard b { font-size:17px; } .tbar { height:6px; border-radius:3px; background:var(--bg2); margin-top:8px; overflow:hidden; } .tbar i { display:block; height:100%; background:var(--brand); }
  .titem { display:flex; align-items:center; gap:10px; min-height:56px; padding:6px 8px 6px 16px; border-bottom:1px solid var(--line); }
  .titem input[type=checkbox] { width:26px; height:26px; flex:none; accent-color:var(--brand); }
  .titem .tb { flex:1; min-width:0; cursor:pointer; } .titem .tb .nm { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .titem.done .nm { text-decoration:line-through; color:var(--muted); }
  .titem .tx { min-height:36px; width:36px; padding:0; border:0; background:none; color:var(--muted); font-size:16px; flex:none; }
  .tadd { display:flex; gap:8px; padding:12px 16px; } .tadd input { flex:1; min-width:0; font-size:16px; min-height:44px; padding:0 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); }
  .trow { display:flex; gap:8px; padding:0 16px 10px; flex-wrap:wrap; }
  .pick { display:flex; align-items:center; gap:12px; min-height:52px; border-bottom:1px solid var(--line); cursor:pointer; font-size:16px; }
  .pick span.ck { width:26px; height:26px; border-radius:7px; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; color:#fff; flex:none; }
  .pick.on span.ck { background:var(--brand); border-color:var(--brand); }
  .rhead { padding:0 16px 8px; }
  .rhead h1 { margin:0; font-size:24px; font-weight:800; letter-spacing:-.02em; color:var(--brand); }
  .rfilters { display:flex; gap:6px; padding:0 16px 10px; flex-wrap:wrap; }
  .rwrap { overflow-x:auto; padding:0 8px; }
  table.rtable { border-collapse:collapse; width:100%; min-width:860px; font-size:14px; }
  .rtable th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:8px; border-bottom:1px solid var(--line); background:var(--bg2); position:sticky; top:0; }
  .rtable td { padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .rtable td.rname { font-weight:600; min-width:150px; }
  .rtable td.ract { white-space:nowrap; }
  .rtable a { color:var(--brand); }
  .rtable tr.approved td { background:rgba(11,138,74,.07); }
  .rtable tr.removed td { opacity:.5; }
  .rtable tr.removed td.rname { text-decoration:line-through; }
  .rbadge { display:inline-block; font-size:11px; font-weight:600; padding:1px 7px; border-radius:999px; background:var(--bg2); color:var(--muted); margin-left:6px; vertical-align:1px; }
  .rbadge.approved { background:#0b8a4a; color:#fff; } .rbadge.removed { background:#b42318; color:#fff; }
  .rnote { font-size:12px; color:#b25e09; margin-top:4px; }
  button.ok { background:#0b8a4a; border-color:#0b8a4a; color:#fff; } button.del { color:#b42318; border-color:#b42318; }
  .empty { padding:30px 14px; color:var(--muted); text-align:center; }
  /* ---------- Walkabout mobile layout ---------- */
  :root { --brand:#0f766e; --nav-h:58px; --safe-b:env(safe-area-inset-bottom, 0px); --safe-t:env(safe-area-inset-top, 0px); }
  html, body { overscroll-behavior:none; -webkit-tap-highlight-color:transparent; font-size:16px; }
  body { position:fixed; inset:0; overflow:hidden; }
  button { min-height:40px; touch-action:manipulation; }
  .top { padding:calc(var(--safe-t) + 8px) 12px 0; }
  .bar { align-items:center; }
  .bar input { font-size:16px; height:46px; padding:0 16px; border-radius:23px; box-shadow:0 2px 10px rgba(0,0,0,.15); border-color:transparent; }
  .bar #go { width:46px; height:46px; padding:0; border-radius:50%; font-size:24px; line-height:1; box-shadow:0 2px 10px rgba(0,0,0,.2); background:var(--brand); border-color:var(--brand); }
  .chips { padding:8px 0 6px; margin:0 -12px; padding-left:12px; padding-right:12px; }
  .chip { min-height:34px; font-size:14px; padding:6px 12px; box-shadow:0 1px 6px rgba(0,0,0,.12); border-color:transparent; white-space:nowrap; flex:none; }
  .chip.on { background:var(--fg); color:var(--bg); box-shadow:none; }
  .nav { position:fixed; left:0; right:0; bottom:0; z-index:1003; height:calc(var(--nav-h) + var(--safe-b)); padding-bottom:var(--safe-b);
         display:grid; grid-template-columns:repeat(4, 1fr); background:var(--bg); border-top:1px solid var(--line); }
  .nav button { border:0; border-radius:0; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
                font-size:20px; color:var(--muted); padding:4px 0; min-height:0; }
  .nav button span { font-size:11px; font-weight:500; }
  .nav button.on { color:var(--brand); }
  .nav button.tracking { color:var(--accent); }
  .sheet { left:0; right:0; bottom:calc(var(--nav-h) + var(--safe-b)); border-radius:18px 18px 0 0; border-width:1px 0 0; max-height:68%;
           padding:22px 16px 16px; box-shadow:0 -4px 20px rgba(0,0,0,.18); overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  .sheet::before { content:""; position:absolute; top:7px; left:50%; width:38px; height:5px; margin-left:-19px; border-radius:3px; background:var(--line); }
  .sheet .x { position:absolute; top:10px; right:10px; width:32px; height:32px; min-height:0; padding:0; border-radius:50%; border:0; background:var(--bg2); color:var(--muted); font-size:15px; }
  .sheet h2 { font-size:20px; padding-right:36px; }
  .sheet .row button, .sheet .row a button { min-height:44px; padding:10px 14px; font-size:15px; }
  .sheet .row a { flex:1 1 auto; } .sheet .row a button { width:100%; }
  .star { min-width:44px; min-height:44px; font-size:26px; }
  label input, label select, label textarea, select.inline { font-size:16px; min-height:44px; }
  #list { bottom:calc(var(--nav-h) + var(--safe-b)); -webkit-overflow-scrolling:touch; }
  .litem { min-height:64px; padding:10px 8px 10px 16px; }
  .litem .ic { width:38px; height:38px; font-size:18px; }
  .lbrand { padding:4px 16px 0; font-size:28px; font-weight:800; letter-spacing:-.02em; color:var(--brand); }
  .leaflet-bottom { bottom:calc(var(--nav-h) + var(--safe-b)); }
  .leaflet-control-attribution { font-size:10px; }
  .menu button { display:flex; width:100%; align-items:center; gap:12px; min-height:52px; border:0; border-bottom:1px solid var(--line); border-radius:0; background:none; font-size:16px; text-align:left; padding:0 4px; }
  .menu button:last-child { border-bottom:0; }
  .bar #logbtn { width:46px; height:46px; padding:0; border-radius:50%; border-color:transparent; background:var(--bg); color:var(--brand); box-shadow:0 2px 10px rgba(0,0,0,.2); display:flex; align-items:center; justify-content:center; flex:none; }
  .litem { position:relative; overflow:hidden; transition:padding-right .18s ease; touch-action:pan-y; }
  .litem .swipe-del { position:absolute; top:0; right:0; bottom:0; width:92px; min-height:0; border:0; border-radius:0; background:#b42318; color:#fff; font-size:15px; font-weight:600;
                      transform:translateX(100%); transition:transform .18s ease; }
  .litem.swiped { padding-right:100px; } .litem.swiped .swipe-del { transform:none; }
  .lhint { padding:2px 16px 6px; }
  #toast { position:fixed; left:50%; bottom:calc(var(--nav-h) + var(--safe-b) + 14px); transform:translateX(-50%); z-index:1100; display:none; align-items:center; gap:14px;
           max-width:calc(100vw - 24px); padding:10px 10px 10px 16px; border-radius:14px; background:#1d1d1f; color:#fff; font-size:15px; box-shadow:0 4px 18px rgba(0,0,0,.35); }
  #toast.show { display:flex; } #toast span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #toast button { min-height:36px; padding:6px 12px; border:0; border-radius:10px; background:#3a3a3c; color:#fff; font-weight:600; flex:none; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .tags .tag { min-height:32px; padding:4px 10px; border-radius:999px; font-size:13px; font-weight:600; background:var(--bg); color:var(--brand); border:1px solid var(--line); }
  .tagline { color:var(--brand); font-weight:600; }
  .ltag { margin:10px 14px 0; font-size:16px; display:flex; align-items:center; gap:8px; } .ltag button { margin-left:auto; min-height:32px; font-size:13px; padding:4px 10px; }
  .seg { display:flex; margin-top:10px; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .seg button { flex:1; min-height:44px; border:0; border-radius:0; background:var(--bg); color:var(--fg); font-size:14px; padding:6px 4px; border-right:1px solid var(--line); }
  .seg button:last-child { border-right:0; } .seg button.on { background:var(--brand); color:#fff; font-weight:600; }
  .litem .name { display:flex; align-items:center; } .litem .name .nm { overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .litem .st { flex:none; font-size:11px; font-weight:600; padding:1px 7px; border-radius:9px; background:var(--bg2); color:var(--muted); margin-left:6px; vertical-align:middle; white-space:nowrap; }
  .litem .st.want-to-go { background:#fdf0d5; color:#8a5a00; } .litem .st.visited { background:#d9f2e3; color:#0b6b3a; }
  .cand { border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-top:10px; }
  .cand.best { border-color:var(--brand); border-width:2px; }
  .cand b { font-size:17px; } .cand a.gl, .result a.gl { font-size:14px; }
  .cand.saved { cursor:pointer; background:var(--bg2); }
  .result { display:flex; align-items:center; gap:10px; min-height:52px; } .result > div { flex:1; min-width:0; }
  .mic { min-height:44px; padding:8px 14px; font-size:15px; border-radius:22px; }
  .mic.rec { background:#b42318; border-color:#b42318; color:#fff; }
  @media (min-width:720px) {
    .sheet { left:12px; right:auto; width:400px; bottom:calc(var(--nav-h) + 12px); border-radius:18px; border-width:1px; }
    .top { right:auto; width:440px; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="list"></div>
<div id="recent"></div>
<div id="trips"></div>
<div class="top">
  <div class="bar">
    <input id="q" type="search" enterkeyhint="search" placeholder="Add a place or paste a Maps link" autocomplete="off" autocapitalize="words">
    <button class="primary" id="go" aria-label="Add place">＋</button>
    <button id="logbtn" aria-label="Log the place I am at" title="Log the place I'm at"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><path d="M12 6.8v5.4M9.3 9.5h5.4"/></svg></button>
  </div>
  <div class="chips" id="chips"></div>
</div>
<div class="sheet" id="sheet"></div>
<div id="toast" role="status"><span id="toast-msg"></span><button id="toast-act"></button></div>
<nav class="nav">
  <button data-nav="map" class="on" aria-label="Map"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg><span>Map</span></button>
  <button data-nav="list" aria-label="List"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg><span>List</span></button>
  <button id="locate" aria-label="Near me"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span>Near me</span></button>
  <button data-nav="more" aria-label="More"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg><span>More</span></button>
</nav>

<script>
const SEED = /*__PLACES__*/null;
const NEAR_METERS = 120;
const LS = { places:'myplaces.local.v1', over:'myplaces.overrides.v1', cats:'myplaces.cats.v1', trips:'walkabout.trips.v1' };
// One-family palette: every category is a shade of the same deep teal; a single-colour line icon tells them apart.
const GLYPHS = {
  nightclub:'<path d="M9 18V5l10-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
  bar:'<path d="M5 4h14l-7 8z"/><path d="M12 12v8M8 20h8"/>',
  'rooftop-bar':'<path d="M3 21V11l5-3v13M8 21V4l8 3v14M16 12l5 2v7M2 21h20"/>',
  restaurant:'<path d="M6 3v7a2 2 0 0 0 4 0V3M8 12v9M17 3c-2 2-3 5-3 8h3v10"/>',
  'social-restaurant':'<path d="M4 20v-7h16v7M2 13h20M8 13V9M16 13V9"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="6" r="2"/>',
  'street-food':'<path d="M4 12h16a8 8 0 0 1-16 0z"/><path d="M9 8c0-2 2-2 2-4M14 8c0-2 2-2 2-4"/>',
  cafe:'<path d="M5 8h12v5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"/><path d="M17 9h2a2 2 0 0 1 0 5h-2M6 21h10"/>',
  market:'<path d="M4 10h16l-2 10H6z"/><path d="M8 10l4-6 4 6"/>',
  mall:'<path d="M6 8h12l1 12H5z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  temple:'<path d="M12 3l3 4H9zM7 11h10l-2-4H9zM6 11v9M18 11v9M4 20h16M10 20v-5h4v5"/>',
  museum:'<path d="M3 9l9-5 9 5zM6 10v8M10 10v8M14 10v8M18 10v8M3 20h18"/>',

  other:'<circle cx="12" cy="12" r="3.5"/>'
};
const lum = hex => { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255; };
const ink = c => lum(c.color) > 0.62 ? '#0b3b3c' : '#fff';   // icon colour that reads on this shade
const glyph = (c, color) => `<span class="gl"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${color || ink(c)}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${GLYPHS[c.id] || GLYPHS.other}</svg></span>`;
const PALETTE = ['#2b6f73','#4d8f8f','#6ea5a1','#3d6b78','#5c9c8a','#82b3aa','#527f8c','#96a8aa'];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => s.toLowerCase().normalize('NFKD').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-').slice(0,60);
const load = k => JSON.parse(localStorage.getItem(k) || (k === LS.over ? '{}' : '[]'));
const store = (k, v) => localStorage.setItem(k, JSON.stringify(v));

// ---------- data: seed (from data/places.json) + this device's additions and edits ----------
function allCats() {
  const seed = (SEED && SEED.categories) || [];
  const ids = new Set(seed.map(c => c.id));
  const custom = load(LS.cats).filter(c => !ids.has(c.id));
  const cats = seed.filter(c => c.id !== 'other').concat(custom);
  const other = seed.find(c => c.id === 'other') || { id:'other', label:'Other', color:'#868e96', icon:'📍', keywords:[] };
  return cats.concat(other); // "Other" always last
}
const cat = id => allCats().find(c => c.id === id) || allCats().find(c => c.id === 'other');
function everyPlace() {
  const seed = (SEED && SEED.places) || [];
  const ids = new Set(seed.map(p => p.id));
  const over = load(LS.over);
  return seed.concat(load(LS.places).filter(p => !ids.has(p.id)))
    .map(p => ({ ...p, ...(over[p.id] || {}) }))
    .map(p => ({ ...p, category: allCats().some(c => c.id === p.category) ? p.category : 'other' }));
}
const allPlaces = () => everyPlace().filter(p => p.review !== 'removed');
const isLocal = id => load(LS.places).some(p => p.id === id);
function setField(id, field, value) {
  if (isLocal(id)) {
    store(LS.places, load(LS.places).map(p => p.id === id ? { ...p, [field]: value } : p));
  } else {
    const over = load(LS.over); over[id] = { ...(over[id] || {}), [field]: value }; store(LS.over, over);
  }
}
function addCategory(label) {
  label = label.trim(); if (!label) return null;
  const existing = allCats().find(c => c.label.toLowerCase() === label.toLowerCase() || c.id === slug(label));
  if (existing) return existing.id;
  const custom = load(LS.cats);
  const c = { id: slug(label), label, color: PALETTE[custom.length % PALETTE.length], icon: '📍', keywords: [label.toLowerCase()], custom: true };
  store(LS.cats, custom.concat(c));
  return c.id;
}

// ---------- auto-categorization ----------
const OSM_MAP = {
  nightclub:'nightclub', stripclub:'nightclub', bar:'bar', pub:'bar', biergarten:'bar',
  restaurant:'restaurant', fast_food:'restaurant', food_court:'street-food',
  cafe:'cafe', bakery:'cafe', ice_cream:'cafe', coffee:'cafe', tea:'cafe', confectionery:'cafe',
  marketplace:'market', mall:'mall', department_store:'mall', supermarket:'mall', clothes:'mall', boutique:'mall',
  place_of_worship:'temple', museum:'museum', gallery:'museum', arts_centre:'museum',
  park:'park', garden:'park', beach:'park', viewpoint:'park', nature_reserve:'park',
  massage:'spa', spa:'spa', sauna:'spa', beauty:'spa',
  hotel:'hotel', hostel:'hotel', guest_house:'hotel', motel:'hotel', apartment:'hotel'
};
function classify({ name = '', osmType = '', osmClass = '', text = '' }) {
  const hay = ` ${(name + ' ' + text).toLowerCase()} `;
  // 1) keyword match on the name/description: longest keyword wins ("rooftop bar" beats "bar")
  let best = null, bestLen = 0;
  for (const c of allCats()) for (const k of (c.keywords || []).concat(c.custom ? [c.label.toLowerCase()] : [])) {
    const re = new RegExp(`(^|[^a-z])${k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}([^a-z]|$)`);
    if (k.length > bestLen && re.test(hay)) { best = c.id; bestLen = k.length; }
  }
  if (best) return best;
  // 2) fall back to what OpenStreetMap says the place is
  if (OSM_MAP[osmType]) return OSM_MAP[osmType];
  if (osmClass === 'shop') return 'mall';
  if (osmClass === 'tourism' && osmType === 'attraction') return 'other';
  return 'other';
}

const sourceOf = p => SOURCES[p.source] ? p.source : /^instagram/.test(p.imported_from || '') ? 'instagram' : /^google/.test(p.imported_from || '') ? 'google-import' : 'manual';

function renderTrips() {

    <div class="tadd"><input id="t-text" placeholder="Add a to-do (e.g. Thai massage, buy SIM)" enterkeyhint="done"><button id="t-add">Add</button></div>`;

// ---------- helpers ----------
const gq = p => p.gmaps_query || [p.name, p.address || p.city].filter(Boolean).join(', ');
const gmaps = p => p.google_maps_url || 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(gq(p));
const gdirections = p => 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(gq(p));
function dist(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = m => m < 1000 ? Math.round(m) + ' m' : (m/1000).toFixed(1) + ' km';
function catOptions(selected) {
  return allCats().map(c => `<option value="${esc(c.id)}" ${c.id === selected ? 'selected' : ''}>${esc(c.label)}</option>`).join('')
    + '<option value="__new">＋ New category…</option>';
}
function pickCategory(sel, onPick) {
  sel.onchange = () => {
    if (sel.value !== '__new') return onPick(sel.value);
    const label = prompt('Name of the new category (e.g. "Jazz bar", "Live music")');
    const id = label && addCategory(label);
    if (id) onPick(id); else sel.value = sel.dataset.prev || 'other';
  };
}

// ---------- state ----------
const filter = { cats: new Set(), starred: false, city: '', status: '', trip: '', tag: '' };
// Tags: free labels like "superlocal". Google list names that duplicate status or source are hidden from the tag list.
const HIDDEN_TAGS = /^(want to go$|instagram saved)/i;
const tagsOf = p => (p.tags || []).filter(t => t && !HIDDEN_TAGS.test(t));
window.showTag = t => { filter.tag = t; close(); setView('list'); renderAll(); };
try { filter.city = localStorage.getItem('walkabout.city') || ''; } catch (e) {}
const inCity = p => !filter.city || (p.city || 'Elsewhere') === filter.city;
let view = 'map', me = null, meMarker = null, nearShownId = null;
const inStatus = p => (!filter.status || statusOf(p) === filter.status) && (!filter.trip || tripPlaceIds(filter.trip).has(p.id)) && (!filter.tag || tagsOf(p).includes(filter.tag));
const visible = () => allPlaces().filter(p => inCity(p) && inStatus(p) && (!filter.starred || p.starred) && (!filter.cats.size || filter.cats.has(p.category)));

// ---------- map ----------
const map = L.map('map', { zoomControl:false }).setView([13.7466, 100.5393], 13); // Bangkok
// Basemap: OpenFreeMap "Liberty" vector style (Google-Maps-like look, free, no API key).
// Labels are forced to English, else romanized (latin) name, else the local name, so Thai streets read
// "Sukhumvit Road" / "Soi Sukhumvit 24" instead of Thai script.
const LATIN_LABEL = ['coalesce', ['get', 'name:en'], ['get', 'name_en'], ['get', 'name:latin'], ['get', 'name_int'], ['get', 'name']];
function latinLabels(gl) {
  for (const l of gl.getStyle().layers) {
    if (l.type !== 'symbol') continue;
    const tf = gl.getLayoutProperty(l.id, 'text-field');
    if (tf && /name/.test(JSON.stringify(tf))) gl.setLayoutProperty(l.id, 'text-field', LATIN_LABEL); // skip road-number shields
  }
}
let basemapOk = false;
function rasterFallback() { // if WebGL or the vector tiles are unavailable
  if (basemapOk) return; basemapOk = true;
  if (window.vectorBase) map.removeLayer(window.vectorBase);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    { maxZoom:20, subdomains:'abcd', attribution:'© OpenStreetMap contributors © CARTO' }).addTo(map);
}
try {
  window.vectorBase = L.maplibreGL({ style:'https://tiles.openfreemap.org/styles/liberty',
    attribution:'<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> © <a href="https://www.openmaptiles.org/" target="_blank">OpenMapTiles</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>' }).addTo(map);
  const gl = window.vectorBase.getMaplibreMap();
  gl.on('style.load', () => { basemapOk = true; latinLabels(gl); });
  setTimeout(rasterFallback, 8000);
} catch (e) { rasterFallback(); }
const layer = L.layerGroup().addTo(map);
const pinIcon = p => { const c = cat(p.category); return L.divIcon({ className:'', iconSize:[30,30], iconAnchor:[15,30],
  html:`<div class="pin-wrap"><div class="pin ${p.starred ? 'starred' : ''} ${p.closed ? 'gone' : ''}" style="background:${c.color}">${glyph(c)}</div></div>` }); };
let fitted = false;
function renderMap() {
  layer.clearLayers();
  const ps = visible();
  ps.forEach(p => L.marker([p.lat, p.lng], { icon:pinIcon(p), title:p.name, zIndexOffset:p.starred ? 500 : 0 }).addTo(layer).on('click', () => showPlace(p.id)));
  if (ps.length && !me && !fitted) { // open on the city with the most places, not the whole world
    const n = {}; ps.forEach(p => { if (p.city) n[p.city] = (n[p.city] || 0) + 1; });
    const top = Object.keys(n).sort((x, y) => n[y] - n[x])[0];
    const home = filter.city ? ps : top ? ps.filter(p => p.city === top) : ps;
    map.fitBounds(L.latLngBounds(home.map(p => [p.lat, p.lng])).pad(0.15), { maxZoom:15 }); fitted = true;
  }
}

  if (filter.tag && !nTag[filter.tag]) nTag[filter.tag] = 0;

      `<option value="${k}" ${k === filter.status ? 'selected' : ''}>${STATUSES[k]} (${nStat[k] || 0})</option>`).join('')}</select>` +
    (tagNames.length ? `<select class="chip statsel ${filter.tag ? 'on' : ''}" id="tagsel" aria-label="Tag"><option value="">Any tag</option>${tagNames.map(t =>
      `<option value="${esc(t)}" ${t === filter.tag ? 'selected' : ''}># ${esc(t)} (${nTag[t]})</option>`).join('')}</select>` : '') +
    `<button class="chip ${!filter.cats.size && !filter.starred ? 'on' : ''}" data-k="all">All ${ps.length}</button>` +
    `<button class="chip ${filter.starred ? 'on' : ''}" data-k="star">★ Starred ${nStar}</button>` +
    cats.map(c => `<button class="chip ${filter.cats.has(c.id) ? 'on' : ''}" data-k="${esc(c.id)}">${glyph(c, 'currentColor')} ${esc(c.label)} ${counts[c.id]}</button>`).join('');
  document.getElementById('citysel').onchange = e => {
    filter.city = e.target.value; try { localStorage.setItem('walkabout.city', filter.city); } catch (err) {}
    filter.cats.clear(); close(); renderAll();

  };
  document.getElementById('statsel').onchange = e => { filter.status = e.target.value; close(); renderAll(); };
  const tagSel = document.getElementById('tagsel'); if (tagSel) tagSel.onchange = e => { filter.tag = e.target.value; close(); renderAll(); };
  document.querySelectorAll('#chips button.chip').forEach(b => b.onclick = () => {

    else if (k === 'star') filter.starred = !filter.starred;
    else filter.cats.has(k) ? filter.cats.delete(k) : filter.cats.add(k);

  });
}

      <button class="swipe-del" data-del="${esc(p.id)}" tabindex="-1">Remove</button></div>`; };
  let body;
  if (!ps.length) body = `<div class="empty">No places match this filter.</div>`;

    const n = {}; ps.forEach(p => { const c = p.city || 'Elsewhere'; (n[c] = n[c] || []).push(p); });

      `<div class="lgroup"><h3>${esc(c)}${n[c][0].country && c !== 'Elsewhere' ? ', ' + esc(n[c][0].country) : ''} · ${n[c].length}</h3>${n[c].sort(byName).map(item).join('')}</div>`).join('');
  }

  }

    const n = {}; ps.forEach(p => { const ts = tagsOf(p); (ts.length ? ts : ['']).forEach(t => (n[t] = n[t] || []).push(p)); });
    body = Object.keys(n).sort((x, y) => (x === '') - (y === '') || x.localeCompare(y)).map(t =>

  }
  else if (sortBy === 'source') {

      `<div class="lgroup"><h3>${esc(SOURCES[k])} · ${g.length}</h3>${g.map(item).join('')}</div>` : ''; }).join('');
  }
  else if (sortBy === 'category') {
    body = allCats().map(c => { const g = ps.filter(p => p.category === c.id).sort(byName); return g.length ?
      `<div class="lgroup"><h3>${glyph(c, 'currentColor')} ${esc(c.label)} · ${g.length}</h3>${g.map(item).join('')}</div>` : ''; }).join('');
  } else body = ps.sort(sortBy === 'distance' ? byDist : byName).map(item).join('');
  const topH = document.querySelector('.top').offsetHeight;
  el.innerHTML = `<div style="height:${topH}px"></div><div class="lbrand">Walkabout</div>
    ${filter.tag ? `<div class="ltag"><b># ${esc(filter.tag)} things</b> · ${ps.length} <button id="tagclear">Show all ✕</button></div>` : ''}
    <div class="ltools"><span class="meta">Sort</span>
      <select class="inline" id="sort">${[['category','By category'],['status','By status'],['added','By date added'],['source','By source'],['tag','By tag'],['city','By city'],['distance','By distance'],['name','By name']].map(([v,l]) => `<option value="${v}" ${v===sortBy?'selected':''}>${l}</option>`).join('')}</select>
      <span style="flex:1"></span><button id="import">Import…</button><button id="export">Export…</button></div>
    ${ps.length ? '<div class="meta lhint">Swipe a place to the left to remove it.</div>' : ''}${body}`;
  el.querySelectorAll('.lgroup h3').forEach(h => h.style.top = topH + 'px');
  const tc = document.getElementById('tagclear'); if (tc) tc.onclick = () => { filter.tag = ''; renderAll(); };
  el.querySelectorAll('.litem').forEach(r => {
    r.onclick = e => {
      if (e.target.dataset.star) return;
      if (e.target.dataset.del) return removeWithUndo(e.target.dataset.del);
      if (r.dataset.swiping) { delete r.dataset.swiping; return; }          // the tap that ends a swipe is not a tap on the row
      if (r.classList.contains('swiped')) return r.classList.remove('swiped'); // tap an open row to close it
      showPlace(r.dataset.id);

    r.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive:true });
    r.addEventListener('touchend', e => {
      if (x0 == null) return;
      const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
      if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      r.dataset.swiping = '1'; setTimeout(() => delete r.dataset.swiping, 350);

      r.classList.toggle('swiped', dx < 0);

  document.getElementById('sort').onchange = e => { sortBy = e.target.value; renderList(); };

}

// ---------- location awareness ----------
function onPos(pos) {
  me = { lat:pos.coords.latitude, lng:pos.coords.longitude };
  if (!meMarker) {
    meMarker = L.marker([me.lat, me.lng], { icon:L.divIcon({ className:'', html:'<div class="me"></div>', iconSize:[22,22] }), zIndexOffset:1000 }).addTo(map);
    map.setView([me.lat, me.lng], 16);
  } else meMarker.setLatLng([me.lat, me.lng]);
  const nearest = allPlaces().map(p => ({ p, d:dist(me, p) })).sort((a,b) => a.d - b.d)[0];
  if (nearest && nearest.d <= NEAR_METERS) {
    if (nearShownId !== nearest.p.id && !(flowOpen && sheet.classList.contains('show'))) { nearShownId = nearest.p.id; showPlace(nearest.p.id, true); if (navigator.vibrate) navigator.vibrate(80); }
  } else nearShownId = null;
  if (view === 'list') renderList();
}
let tracking = false;
function startTracking() {
  if (tracking) { if (me) { if (view === 'list') setView('map'); map.setView([me.lat, me.lng], Math.max(map.getZoom(), 16)); } return; }
  if (!navigator.geolocation) return alert('Location is not available in this browser');
  tracking = true; document.getElementById('locate').classList.add('tracking');
  navigator.geolocation.watchPosition(onPos, e => { tracking = false; document.getElementById('locate').classList.remove('tracking'); alert('Location: ' + e.message); },
    { enableHighAccuracy:true, maximumAge:15000 });
}
document.getElementById('locate').onclick = startTracking;
if (navigator.permissions) navigator.permissions.query({ name:'geolocation' }).then(s => { if (s.state === 'granted') startTracking(); });

// ---------- add by name ----------
function parseGmapsUrl(s) {
  const m = s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || s.match(/[?&](?:q|query|ll)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/) || s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  if (!m) return null;
  const name = decodeURIComponent((s.match(/\/place\/([^/@]+)/) || [,''])[1]).replace(/\+/g, ' ');
  return { lat:+m[1], lng:+m[2], name };
}
async function search(q) {
  const c = map.getCenter();
  const vb = [c.lng - 0.3, c.lat + 0.3, c.lng + 0.3, c.lat - 0.3].join(',');
  const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&extratags=1&limit=6&viewbox=${vb}&q=${encodeURIComponent(q)}`;
  const r = await fetch(url, { headers:{ 'Accept-Language':'en' } });
  return r.ok ? r.json() : [];
}
function addForm(seed) {
  const auto = seed.category || classify({ name: seed.name, osmType: seed.osmType, osmClass: seed.osmClass, text: seed.text });
  if (view === 'list') setView('map');
  flowOpen = true;
  open(`<h2>${esc(seed.title || 'New place')}</h2>
    <label>Name<input id="f-name" value="${esc(seed.name)}" placeholder="Name of the place"></label>
    <label>Category <span id="f-auto">(auto: ${esc(cat(auto).label)})</span><select id="f-cat" data-prev="${esc(auto)}">${catOptions(auto)}</select></label>
    <label>Address / floor<input id="f-addr" value="${esc(seed.address || '')}"></label>
    <label>${seed.logged ? 'What is this place? (your comment)' : 'Notes'}<textarea id="f-notes" rows="3" placeholder="${seed.logged ? 'Why it is worth remembering, who you met, what to order' : 'What makes it good, what to order'}"></textarea></label>
    <div class="row" style="margin-top:6px"><button class="mic" id="f-mic" type="button">🎤 Dictate</button><span class="meta" id="f-mic-hint" style="flex:1"></span></div>
    <label>Google Maps link (optional)<input id="f-gurl" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="Paste the share link of the exact listing"></label>
    ${seed.gcheck ? `<div class="meta" style="margin-top:4px"><a class="gl" href="${esc(seed.gcheck)}" target="_blank" rel="noopener">Check this spot on Google Maps ↗</a></div>` : ''}
    <div class="row"><button class="star" id="f-star" title="Star">☆</button><span class="meta">Pin: ${seed.lat.toFixed(5)}, ${seed.lng.toFixed(5)} — drag the marker to adjust</span></div>
    <div class="row"><button class="primary" id="f-save">Save</button><button onclick="cancelAdd()">Cancel</button></div>`);
  const tmp = L.marker([seed.lat, seed.lng], { draggable:true }).addTo(map);
  try { map.setView([seed.lat, seed.lng], 17); } catch (e) {}
  const sel = document.getElementById('f-cat');
  let touched = false;
  pickCategory(sel, cid => { touched = true; sel.innerHTML = catOptions(cid); sel.dataset.prev = cid; document.getElementById('f-auto').textContent = ''; });
  // re-run auto-categorization as the user edits the name/notes, until they pick one by hand
  const recat = () => { if (touched) return; const c = classify({ name: document.getElementById('f-name').value, osmType: seed.osmType, osmClass: seed.osmClass,
      text: document.getElementById('f-notes').value + ' ' + (seed.text || '') });
    sel.value = c; sel.dataset.prev = c; document.getElementById('f-auto').textContent = `(auto: ${cat(c).label})`; };
  document.getElementById('f-name').oninput = recat; document.getElementById('f-notes').oninput = recat;
  let starred = false;
  const sb = document.getElementById('f-star');
  sb.onclick = () => { starred = !starred; sb.textContent = starred ? '★' : '☆'; sb.classList.toggle('is', starred); };
  const stopMic = wireDictation(document.getElementById('f-mic'), document.getElementById('f-notes'), document.getElementById('f-mic-hint'));
  if (seed.logged && !seed.name) document.getElementById('f-name').focus();
  window.cancelAdd = () => { stopMic(); map.removeLayer(tmp); close(); };
  document.getElementById('f-save').onclick = () => {
    const ll = tmp.getLatLng(), nameEl = document.getElementById('f-name'), name = nameEl.value.trim();
    if (!name) { nameEl.focus(); nameEl.style.borderColor = '#b42318'; return; }
    stopMic();
    const gurl = document.getElementById('f-gurl').value.trim();
    const today = new Date().toISOString().slice(0,10);
    const p = { id: slug(name) + '-' + Date.now().toString(36).slice(-4), name, category: sel.value === '__new' ? 'other' : sel.value,
      city: seed.city || '', country: seed.country || '', address: document.getElementById('f-addr').value.trim(),
      lat:+ll.lat.toFixed(6), lng:+ll.lng.toFixed(6), coords_precision: seed.precision || 'exact', notes: document.getElementById('f-notes').value.trim(),
      tags:[], sources:[], starred, visited: today, added: today };
    if (/^https?:\/\//i.test(gurl)) { p.google_maps_url = gurl; p.sources = [gurl]; }
    p.source = seed.logged ? 'gps-log' : 'manual'; p.status = seed.logged ? 'visited' : 'identified';
    store(LS.places, load(LS.places).concat(p)); map.removeLayer(tmp); document.getElementById('q').value = ''; renderAll(); showPlace(p.id);
  };
}
document.getElementById('go').onclick = async () => {
  const q = document.getElementById('q').value.trim();
  if (!q) return;

  if (g) return addForm({ ...g, name: g.name || '' });
  if (view === 'list') setView('map');
  open('<div class="meta">Searching…</div>');

  try { res = await search(q); } catch (e) {}
  const items = res.map((r, i) => `<div class="result" data-i="${i}"><b>${esc(r.name || r.display_name.split(',')[0])}</b><div class="meta">${esc(r.display_name)}</div></div>`).join('');
  open(`<h2>Pick a match for “${esc(q)}”</h2>${items || '<div class="meta">No match on OpenStreetMap.</div>'}

      text: Object.values(r.extratags || {}).join(' ') });

// ---------- dictation (speech-to-text into a textarea) ----------
function wireDictation(btn, ta, hint) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { btn.style.display = 'none'; hint.textContent = 'To dictate, tap the 🎤 on your keyboard.'; return () => {}; }
  let rec = null, base = '';
  const stop = () => { if (rec) { try { rec.stop(); } catch (e) {} } };
  btn.onclick = () => {
    if (rec) return stop();
    rec = new SR(); rec.lang = navigator.language || 'en-US'; rec.interimResults = true; rec.continuous = true;
    base = ta.value.trim() ? ta.value.trim() + ' ' : '';
    rec.onresult = e => { let t = ''; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript + ' ';
      ta.value = base + t.replace(/\s+/g, ' ').trim(); ta.dispatchEvent(new Event('input')); };
    rec.onerror = e => { hint.textContent = e.error === 'not-allowed' || e.error === 'service-not-allowed'
      ? 'Microphone is blocked here. Tap the 🎤 on your keyboard instead.' : 'Dictation stopped. Tap Dictate to continue, or use the keyboard 🎤.'; };
    rec.onend = () => { rec = null; btn.classList.remove('rec'); btn.textContent = '🎤 Dictate'; if (hint.textContent === 'Listening…') hint.textContent = ''; };
    try { rec.start(); btn.classList.add('rec'); btn.textContent = '■ Stop'; hint.textContent = 'Listening…'; }
    catch (e) { rec = null; hint.textContent = 'Dictation is not available. Tap the 🎤 on your keyboard instead.'; }
  };
  return stop;
}

// ---------- log the place I'm at: GPS fix → nearby places → "is this where you are?" → comment ----------
const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
const POI_KEYS = ['amenity', 'shop', 'tourism', 'leisure', 'craft', 'office', 'healthcare'];
const LOG_SAVED_M = 80;
// Google Maps opened at this exact spot, searching for the name: the link the user checks before confirming.
const gcheck = (name, pos) => name
  ? `https://www.google.com/maps/search/${encodeURIComponent(name)}/@${pos.lat.toFixed(6)},${pos.lng.toFixed(6)},19z`
  : `https://www.google.com/maps/search/?api=1&query=${pos.lat.toFixed(6)},${pos.lng.toFixed(6)}`;
const getFix = () => new Promise((res, rej) => {
  if (!navigator.geolocation) return rej(new Error('location is not available in this browser'));
  navigator.geolocation.getCurrentPosition(p => res({ lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy }), rej,
    { enableHighAccuracy:true, timeout:20000, maximumAge:5000 });
});
async function fetchJSON(url, opts = {}, ms = 9000) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), ms);
  try { const r = await fetch(url, { ...opts, signal: ac.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
const poiSort = (a, b) => a.d - b.d;
async function photonPOIs(pos, radius) { // Photon (komoot): fast reverse lookup that returns several OpenStreetMap features around a point
  const j = await fetchJSON(`https://photon.komoot.io/reverse?lat=${pos.lat}&lon=${pos.lng}&radius=${(radius / 1000).toFixed(3)}&limit=25&lang=en`, {}, 7000);
  return (j.features || []).map(ft => {
    const p = ft.properties || {}, c = (ft.geometry || {}).coordinates || [];
    if (!p.name || c.length < 2 || !(POI_KEYS.includes(p.osm_key) || p.osm_key === 'building')) return null;
    const lat = c[1], lng = c[0];
    return { name: p.name, search: p.name, lat, lng, osmClass: p.osm_key, osmType: p.osm_value,
      kind: p.osm_key === 'building' ? 'building' : String(p.osm_value || '').replace(/_/g, ' '),
      address: [p.housenumber, p.street].filter(Boolean).join(' '), text: [p.osm_value, p.osm_key].join(' '), d: dist(pos, { lat, lng }) };
  }).filter(c => c && c.d <= radius).sort(poiSort);
}
async function overpassPOIs(pos, radius) {
  const q = `[out:json][timeout:6];nwr(around:${radius},${pos.lat},${pos.lng})[name][~"^(${POI_KEYS.join('|')})$"~"."];out center tags 40;`;
  const j = await fetchJSON(OVERPASS[0] + '?data=' + encodeURIComponent(q), {}, 7000);
  return (j.elements || []).map(e => {
    const t = e.tags || {}, lat = e.lat ?? (e.center && e.center.lat), lng = e.lon ?? (e.center && e.center.lon);
    if (lat == null || lng == null) return null;
    const en = t['name:en'], local = t.name, key = POI_KEYS.find(k => t[k]);
    return { name: en && local && en !== local ? `${en} (${local})` : (en || local), search: en || local, lat, lng,
      osmClass: key, osmType: t[key], kind: String(t[key] || '').replace(/_/g, ' '),
      address: [[t['addr:housenumber'], t['addr:street']].filter(Boolean).join(' '), t.level ? 'level ' + t.level : ''].filter(Boolean).join(', '),
      text: [t.cuisine, t.description, t.amenity, t.shop, t.leisure, t.tourism].filter(Boolean).join(' '), d: dist(pos, { lat, lng }) };
  }).filter(Boolean).sort(poiSort);
}
async function nearbyPOIs(pos, radius) { // null = both lookups failed, [] = nothing named here
  try { return await photonPOIs(pos, radius); } catch (e) {}
  try { return await overpassPOIs(pos, radius); } catch (e) {}
  return null;
}
async function reverseGeo(pos) {
  try {
    const j = await fetchJSON(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&lat=${pos.lat}&lon=${pos.lng}`, { headers:{ 'Accept-Language':'en' } }, 7000);
    const a = j.address || {};
    return { address: [[a.house_number, a.road].filter(Boolean).join(' '), a.suburb || a.neighbourhood || a.quarter].filter(Boolean).join(', '),
      city: a.city || a.town || a.village || a.state || '', country: a.country || '' };
  } catch (e) { return { address:'', city:'', country:'' }; }
}
async function logHere(fixed) {
  if (view !== 'map') setView('map');
  flowOpen = true;
  open('<h2>Log this place</h2><div class="meta">Finding where you are…</div>');
  let pos;
  try { pos = fixed || await getFix(); }
  catch (e) {
    return open(`<h2>Log this place</h2><p>Could not get your location${e && e.message ? ' (' + esc(e.message) + ')' : ''}.</p>
      <div class="meta">Allow location for Walkabout in your browser settings, then try again.</div>
      <div class="row"><button class="primary" onclick="logHere()">Try again</button></div>`);
  }
  try { map.setView([pos.lat, pos.lng], 18); } catch (e) {} // the basemap may still be loading; the lookup does not need it
  const radius = Math.round(Math.max(60, Math.min((pos.acc || 30) * 1.5, 150)));
  try {
    open(`<h2>Log this place</h2><div class="meta">Got your position (±${Math.round(pos.acc || 0)} m). Looking up what is here…</div>`);
    const [pois, geo] = await Promise.all([nearbyPOIs(pos, radius), reverseGeo(pos)]);
    showCandidates(pos, pois, geo, radius);
  } catch (e) {
    open(`<h2>Log this place</h2><p>Something went wrong while looking up this spot.</p><div class="meta">${esc(e && e.message || e)}</div>
      <div class="row"><button class="primary" onclick="logHere()">Try again</button></div>`);
  }
}
window.logHere = logHere;
function showCandidates(pos, pois, geo, radius) {
  const saved = allPlaces().map(p => ({ p, d: dist(pos, p) })).filter(x => x.d <= LOG_SAVED_M).sort((a, b) => a.d - b.d).slice(0, 3);
  const list = (pois || []).slice(0, 8), top = list[0], rest = list.slice(1);
  const sub = c => [c.kind, fmtDist(c.d) + ' away', c.address].filter(Boolean).map(esc).join(' · ');
  open(`<h2>${top ? 'Is this where you are?' : 'Log this place'}</h2>
    <div class="meta">GPS ±${Math.round(pos.acc || 0)} m${geo.address ? ' · ' + esc(geo.address) : ''}${geo.city ? ' · ' + esc(geo.city) : ''}</div>
    ${saved.map(x => `<div class="cand saved" data-saved="${esc(x.p.id)}"><b>${esc(x.p.name)}</b><div class="meta">Already in Walkabout · ${fmtDist(x.d)} away · tap to open</div></div>`).join('')}
    ${top ? `<div class="cand best"><b>${esc(top.name)}</b><div class="meta">${sub(top)}</div>
      <a class="gl" href="${esc(gcheck(top.search, top))}" target="_blank" rel="noopener">Check on Google Maps ↗</a>
      <div class="row"><button class="primary" id="c-yes">Yes, this is it</button></div></div>` : ''}
    ${rest.length ? `<div class="meta" style="margin-top:12px">Or one of these nearby:</div>` + rest.map((c, i) => `<div class="result" data-i="${i + 1}"><div><b>${esc(c.name)}</b>
      <div class="meta">${sub(c)}</div></div><a class="gl" href="${esc(gcheck(c.search, c))}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Google ↗</a></div>`).join('') : ''}
    ${pois === null ? '<div class="meta" style="margin-top:10px">The place lookup could not be reached. You can still log this spot by name.</div>'
      : !list.length ? `<div class="meta" style="margin-top:10px">No named place found within ${radius} m. Name it yourself and it is pinned at your position.</div>` : ''}
    <div class="row"><button id="c-none" class="${top ? '' : 'primary'}">${top ? 'None of these' : 'Name this place'}</button>
      <a href="${esc(gcheck('', pos))}" target="_blank" rel="noopener"><button>See this spot on Google Maps</button></a></div>`);
  const pick = c => addForm({ title:'Log this place', logged:true, name:c.name, lat:c.lat, lng:c.lng, address:c.address || geo.address, city:geo.city, country:geo.country,
    osmType:c.osmType, osmClass:c.osmClass, text:c.text, gcheck:gcheck(c.search, c) });
  const yes = document.getElementById('c-yes'); if (yes) yes.onclick = () => pick(top);
  sheet.querySelectorAll('.result').forEach(el => el.onclick = () => pick(list[+el.dataset.i]));
  sheet.querySelectorAll('[data-saved]').forEach(el => el.onclick = () => showPlace(el.dataset.saved, true));
  document.getElementById('c-none').onclick = () => addForm({ title:'Log this place', logged:true, name:'', lat:pos.lat, lng:pos.lng, address:geo.address, city:geo.city,
    country:geo.country, gcheck:gcheck('', pos), precision: (pos.acc || 0) > 25 ? 'approximate' : 'exact' });
}
document.getElementById('logbtn').onclick = () => logHere();

// ---------- export ----------
function download(name, mime, body) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], { type:mime })); a.download = name; a.click();
}
const kmlColor = hex => 'ff' + hex.slice(5,7) + hex.slice(3,5) + hex.slice(1,3); // KML is aabbggrr
function toKML(ps) {
  const used = allCats().filter(c => ps.some(p => p.category === c.id));
  return `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Walkabout</name>\n` +
    used.map(c => `<Style id="cat-${esc(c.id)}"><IconStyle><color>${kmlColor(c.color)}</color></IconStyle></Style>`).join('\n') + '\n' +
    used.map(c => `<Folder><name>${esc(c.label)}</name>\n` + ps.filter(p => p.category === c.id).map(p =>
      `<Placemark><name>${esc((p.starred ? '★ ' : '') + p.name)}</name><styleUrl>#cat-${esc(c.id)}</styleUrl><description>${esc([c.label, p.address, p.notes, gmaps(p)].filter(Boolean).join('\n'))}</description><Point><coordinates>${p.lng},${p.lat},0</coordinates></Point></Placemark>`).join('\n') + `\n</Folder>`).join('\n') +
    `\n</Document></kml>`;
}
function toCSV(ps) {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  return ['name,category,starred,address,city,latitude,longitude,notes,google_maps_url,source,status,added']
    .concat(ps.map(p => [p.name, cat(p.category).label, p.starred ? 'yes' : '', p.address, p.city, p.lat, p.lng, p.notes, gmaps(p), sourceLabel(p), STATUSES[statusOf(p)], p.added].map(q).join(','))).join('\n');
}
function showExport() {
  if (view !== 'map') setView('map');
  const nChanges = load(LS.places).length + Object.keys(load(LS.over)).length + load(LS.cats).length;
  open(`<h2>Export</h2>
    <div class="row">
      <button id="x-kml">KML for Google My Maps</button>
      <button id="x-csv">CSV</button>
      <button id="x-json" class="primary">My changes (JSON) · ${nChanges}</button>
    </div>
    <div class="meta" style="margin-top:8px">New places, stars, category changes and new categories are saved on this device only.

// ---------- import from Google Takeout ----------
// Accepts the Takeout .zip, or individual files from it:
//   Maps (your places)/Saved Places.json   GeoJSON, starred places, usually with coordinates
//   Maps (your places)/Reviews.json        GeoJSON, places you reviewed
//   Maps/My labeled places/Labeled places.json
//   Saved/<list name>.csv                  one CSV per saved list; often only Title/Note/URL, no coordinates
const FAV_LISTS = /^(favou?rite|starred|star)/i;
function coordsFromUrl(u) {
  if (!u) return null;
  const m = u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || u.match(/[?&](?:q|query|ll)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/);
  return m ? { lat:+m[1], lng:+m[2] } : null;
}
function nameFromUrl(u) {
  const m = (u || '').match(/\/place\/([^/@?]+)/);
  return m ? decodeURIComponent(m[1]).replace(/\+/g, ' ') : '';
}
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function fromGeoJSON(json, source) {
  return (json.features || []).map(ft => {
    const pr = ft.properties || {}, loc = pr.location || pr.Location || {};
    const g = (ft.geometry && ft.geometry.coordinates) || [];
    let lat = +g[1], lng = +g[0];
    const geo = loc['Geo Coordinates'];
    if ((!lat && !lng) && geo) { lat = +geo.Latitude; lng = +geo.Longitude; }
    const url = pr.google_maps_url || pr['Google Maps URL'] || '';
    if (!lat && !lng) { const c = coordsFromUrl(url); if (c) ({ lat, lng } = c); }
    return {
      name: loc.name || loc['Business Name'] || pr.Title || pr.name || nameFromUrl(url),
      address: loc.address || loc.Address || pr.address || '',
      country: loc.country_code || loc['Country Code'] || '',
      lat: lat || null, lng: lng || null, url,
      note: pr.Comment || pr.review_text_published || pr['Review Comment'] || '',
      list: source, starred: /saved places/i.test(source),
      date: (pr.date || pr.Published || pr.Updated || '').slice(0, 10)
    };
  }).filter(x => x.name);
}
function fromSavedCSV(text, listName) {
  const rows = parseCSV(text); if (!rows.length) return [];
  const head = rows[0].map(h => h.trim().toLowerCase());
  const col = n => head.indexOf(n);
  const ui = col('url');
  return rows.slice(1).map(r => {
    // unquoted URLs like .../@13.74,100.48,17z contain commas: glue the extra fields back into the URL
    if (ui >= 0 && r.length > head.length) r = r.slice(0, ui).concat(r.slice(ui, ui + r.length - head.length + 1).join(','), r.slice(ui + r.length - head.length + 1));
    const url = r[ui] || '';
    const c = coordsFromUrl(url);
    return { name: (r[col('title')] || '').trim() || nameFromUrl(url), note: [r[col('note')], r[col('comment')]].filter(Boolean).join(' — '),
      tags: (r[col('tags')] || '').split(/[,;]/).map(s => s.trim()).filter(Boolean),
      url, lat: c ? c.lat : null, lng: c ? c.lng : null, address: '', list: listName, starred: FAV_LISTS.test(listName) };
  }).filter(x => x.name);
}
async function readImportFiles(files) {
  const out = [];
  const handle = async (path, text) => {
    const base = path.split('/').pop(), listName = base.replace(/\.(csv|json)$/i, '');
    if (/\.json$/i.test(base)) { try { const j = JSON.parse(text); if (j.features) out.push(...fromGeoJSON(j, listName)); } catch (e) {} }
    else if (/\.csv$/i.test(base)) out.push(...fromSavedCSV(text, listName));
  };
  for (const f of files) {
    if (/\.zip$/i.test(f.name)) {
      if (!window.JSZip) await new Promise((ok, err) => { const s = document.createElement('script');
        s.src = 'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js'; s.onload = ok; s.onerror = err; document.head.appendChild(s); });
      const zip = await JSZip.loadAsync(f);
      for (const path of Object.keys(zip.files)) {
        if (!/(maps|saved)/i.test(path) || !/\.(csv|json)$/i.test(path)) continue;
        await handle(path, await zip.files[path].async('string'));
      }
    } else await handle(f.name, await f.text());
  }
  return out;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function geocodeName(name, hint) {
  const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=1&q=${encodeURIComponent([name, hint].filter(Boolean).join(', '))}`;
  const r = await fetch(url, { headers:{ 'Accept-Language':'en' } }); if (!r.ok) return null;
  const [hit] = await r.json(); if (!hit) return null;
  const a = hit.address || {};
  return { lat:+hit.lat, lng:+hit.lon, address: hit.display_name.split(',').slice(0,4).join(','), city: a.city || a.town || a.state || '',
    country: a.country || '', osmType: hit.type, osmClass: hit.category };
}
function showImport() {
  if (view === 'list') setView('map');
  open(`<h2>Import from Google Maps</h2>
    <ol class="meta" style="padding-left:18px;margin:6px 0">
      <li>Go to <a href="https://takeout.google.com" target="_blank" rel="noopener">takeout.google.com</a> → “Deselect all”.</li>
      <li>Tick <b>Saved</b> (your lists) and <b>Maps (your places)</b> (starred places, reviews). Optionally <b>Maps</b> (labeled places).</li>
      <li>Export once, download the .zip, and pick it here. Individual .csv/.json files work too.</li>
    </ol>
    <label>Hint for places without coordinates (helps the lookup)<input id="i-hint" placeholder="e.g. Bangkok"></label>
    <div class="row"><input type="file" id="i-file" accept=".zip,.json,.csv" multiple></div>
    <div id="i-status" class="meta" style="margin-top:8px"></div>`);
  document.getElementById('i-file').onchange = async e => {
    const st = document.getElementById('i-status'), hint = document.getElementById('i-hint').value.trim();
    st.textContent = 'Reading…';
    let items;
    try { items = await readImportFiles([...e.target.files]); } catch (err) { st.textContent = 'Could not read that file: ' + err.message; return; }
    if (!items.length) { st.textContent = 'No saved places found. Make sure the export includes “Saved” or “Maps (your places)”.'; return; }
    // de-duplicate: same Google URL, or same name within 150 m; merge lists/stars
    const existing = allPlaces(), merged = [];
    for (const it of items) {
      const twin = merged.find(m => (it.url && m.url === it.url) || (m.name.toLowerCase() === it.name.toLowerCase() && (!m.lat || !it.lat || dist(m, it) < 150)));
      if (twin) { twin.lists.add(it.list); twin.starred ||= it.starred; twin.note ||= it.note; if (!twin.lat && it.lat) Object.assign(twin, { lat:it.lat, lng:it.lng }); twin.tags.push(...(it.tags||[])); }
      else merged.push({ ...it, lists: new Set([it.list]), tags: [...(it.tags || [])] });
    }
    const fresh = merged.filter(m => !existing.some(p => (m.url && p.google_maps_url === m.url) || (p.name.toLowerCase() === m.name.toLowerCase() && (!m.lat || dist(p, m) < 150))));
    const skipped = merged.length - fresh.length, failed = [], added = [];
    const today = new Date().toISOString().slice(0,10);
    for (let i = 0; i < fresh.length; i++) {
      const m = fresh[i];
      st.textContent = `Importing ${i + 1} / ${fresh.length}: ${m.name}${!m.lat ? ' (looking up location…)' : ''}`;
      let geo = null;
      if (!m.lat) { try { geo = await geocodeName(m.name, m.address || hint); } catch (err) {} await sleep(1100); } // Nominatim: max 1 req/s
      if (!m.lat && !geo) { failed.push(m); continue; }
      const listTags = [...m.lists].map(s => s.toLowerCase());
      const p = { id: slug(m.name) + '-' + Math.random().toString(36).slice(2, 6), name: m.name,
        category: classify({ name: m.name, osmType: geo && geo.osmType, osmClass: geo && geo.osmClass, text: [m.note, ...listTags, ...m.tags].join(' ') }),
        city: (geo && geo.city) || '', country: (geo && geo.country) || m.country || '', address: m.address || (geo && geo.address) || '',
        lat: +(m.lat || geo.lat).toFixed(6), lng: +(m.lng || geo.lng).toFixed(6), coords_precision: m.lat ? 'exact' : 'approximate',
        google_maps_url: m.url || undefined, notes: m.note || '', tags: [...new Set(listTags.concat(m.tags))], sources: [],
        starred: !!m.starred, visited: null, added: today, imported_from: 'google-takeout', source: 'google-import' };
      added.push(p);
    }
    store(LS.places, load(LS.places).concat(added)); fitted = false; renderAll();
    st.innerHTML = `<b>Imported ${added.length}</b>${skipped ? ` · ${skipped} already here` : ''}${failed.length ? ` · ${failed.length} couldn't be located` : ''}.
      Categories were set automatically; fix any from the place card or the list.
      ${added.some(p => p.coords_precision === 'approximate') ? '<br>Pins looked up by name are approximate: check them.' : ''}
      ${failed.length ? `<br><button id="i-failed">Download the ${failed.length} unlocated places</button>` : ''}
      <br>Then use Export… → My changes and send the file to Claude to save it for all devices.`;
    const fb = document.getElementById('i-failed');
    if (fb) fb.onclick = () => download('unlocated-places.csv', 'text/csv', 'name,lists,note,url\n' +
      failed.map(m => [m.name, [...m.lists].join('; '), m.note, m.url].map(v => `"${String(v || '').replace(/"/g,'""')}"`).join(',')).join('\n'));
  };
}

// deep links: #<place-id> opens a place, #list opens the list, #log logs the place you are at, #log@<lat>,<lng> logs given coordinates
renderAll();
const hash = decodeURIComponent(location.hash.slice(1));
if (hash === 'list') setView('list');
else if (hash === 'recent') setView('recent');
else if (hash === 'trips') setView('trips');
else if (hash === 'import') showImport();
else if (hash === 'log') logHere();
else if (/^log@-?\d+(\.\d+)?,-?\d+(\.\d+)?$/.test(hash)) { const [la, lo] = hash.slice(4).split(',').map(Number); logHere({ lat:la, lng:lo, acc:20 }); }
else if (hash) showPlace(hash);
</script>
